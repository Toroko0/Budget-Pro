appId: com.budgetpro.vault
productName: Budget Pro
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - electron/**/*
  - public/icon-512.png
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/icon-512.png
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
