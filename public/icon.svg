<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b8296" />
      <stop offset="100%" stop-color="#1b4d5c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer card / vault base -->
  <g filter="url(#shadow)">
    <!-- Back ledger tab -->
    <rect x="136" y="110" width="240" height="70" rx="20" fill="#9bd1db" opacity="0.8" />
    <!-- Main wallet body -->
    <rect x="96" y="140" width="320" height="230" rx="36" fill="#ffffff" />
    <!-- Vault seam line -->
    <line x1="96" y1="225" x2="300" y2="235" stroke="#d4e8e8" stroke-width="4" stroke-linecap="round" />
    <!-- Clasp / Lock badge -->
    <rect x="300" y="215" width="124" height="84" rx="28" fill="url(#accentGrad)" />
    <!-- Brass rivet / Keyhole ring -->
    <circle cx="344" cy="257" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="3" />
  </g>
</svg>
